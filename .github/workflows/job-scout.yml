name: Job Scout Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  actions: read

jobs:
  job_scout:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Verify config files exist
        run: |
          echo "Checking for required config files..."
          ls -la config/
          ls -la src/
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip list
      
      - name: Create data directory
        run: |
          mkdir -p data
          touch job_scout.log
      
      - name: Run job scraper
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          python -u src/job_scraper.py 2>&1 | tee -a job_scout.log
      
      - name: Show results
        if: always()
        run: |
          echo "=== JOB SCOUT LOG ==="
          cat job_scout.log
          echo ""
          echo "=== DATA FILES ==="
          ls -la data/ || echo "No data files created"
      
      - name: Commit changes
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Update job database - $(date '+%Y-%m-%d %H:%M:%S')"
      
      - name: Push changes
        if: success()
        run: |
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
      
      - name: Upload logs and data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-scout-logs-${{ github.run_number }}
          path: |
            job_scout.log
            data/
          if-no-files-found: warn
